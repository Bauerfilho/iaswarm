<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iaswarm — enxame de frota</title>
<style>
  :root{
    --fundo:#0b1e24; --fundo2:#0e2831; --card:#10303b; --borda:#1b4552;
    --texto:#e9e4da; --sub:#8fb0ba; --coral:#e8604c;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(31,90,106,.35), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(232,96,76,.10), transparent 55%),
      var(--fundo);
    color:var(--texto);
    font:15px/1.5 -apple-system, "SF Pro Text", Inter, sans-serif;
    min-height:100vh; padding:40px clamp(16px,5vw,72px);
  }
  header{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:8px}
  h1{font-size:22px; letter-spacing:.4px; font-weight:700}
  h1 .ia{color:var(--coral)}
  #missao{color:var(--sub); font-size:15px}
  #meta{color:var(--sub); font-size:12px; margin-bottom:26px}
  #grid{display:grid; gap:12px}
  .linha{
    display:grid; grid-template-columns:170px 1fr auto; align-items:center; gap:18px;
    background:linear-gradient(180deg, var(--card), var(--fundo2));
    border:1px solid var(--borda); border-radius:14px; padding:14px 20px;
    transition:border-color .4s;
  }
  .linha.falhou{border-color:var(--coral)}
  .braco{display:flex; align-items:center; gap:10px; min-width:0}
  .chip{width:12px; height:12px; border-radius:4px; flex:none;
        box-shadow:0 0 10px 1px var(--cor)}
  .braco b{font-size:14px; letter-spacing:.3px}
  .braco small{display:block; color:var(--sub); font-size:11.5px;
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pista{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .bola{
    width:18px; height:18px; border-radius:50%;
    background:#123241; border:1.5px solid #1d4555;
    transition:all .5s ease;
  }
  .bola.feita{
    background:var(--cor); border-color:var(--cor);
    box-shadow:0 0 14px 2px var(--cor), 0 0 34px 4px color-mix(in srgb, var(--cor) 45%, transparent);
  }
  .bola.ativa{
    border-color:var(--cor);
    animation:pulsa 1.1s ease-in-out infinite;
  }
  @keyframes pulsa{
    0%,100%{box-shadow:0 0 4px 0 var(--cor)}
    50%{box-shadow:0 0 16px 4px var(--cor)}
  }
  .linha.falhou .bola.feita, .linha.falhou .bola.ativa{
    background:var(--coral); border-color:var(--coral);
    box-shadow:0 0 14px 2px var(--coral); animation:none;
  }
  .linha.pulado{opacity:.45}
  .linha.pulado .chip{--cor:#5b6a70}
  .placar{text-align:right; min-width:120px}
  .placar b{font-size:16px}
  .estado{font-size:11.5px; color:var(--sub); text-transform:uppercase; letter-spacing:.8px}
  .estado.entregue{color:#7ee2a8}
  .estado.falhou{color:var(--coral)}
  footer{margin-top:28px; color:var(--sub); font-size:11.5px}
</style>
</head>
<body>
<header><h1>ia<span class="ia">swarm</span></h1><span id="missao">—</span></header>
<div id="meta">—</div>
<div id="grid"></div>
<footer>brilho = evidência em disco · falha é sempre coral · síntese e gates são da orquestradora</footer>
<script>
const CORES = {
  agy:"#4285F4", kimi:"#A78BFA", codex:"#10A37F", grok:"#EDEDED",
  qwen:"#7C3AED", ollama:"#F59E0B", deepseek:"#1E40AF", hermes:"#D4A017",
  copilot:"#2188FF", dourada:"#FFD700"
};
const ROTULO_ESTADO = {fila:"na fila", despachado:"despachado", rodando:"trabalhando",
  entregue:"entregue ✓", falhou:"FALHOU", pulado:"pulado (cota)"};
let lastSig="";
function sigW(w){return JSON.stringify([w.worker,w.braco,w.estado,w.feitas,w.etapas,w.nota||""])}
function pintar(w){
  const cor=CORES[w.braco]||"#8fb0ba";
  const li=document.createElement("div");
  li.dataset.w=w.worker; li.dataset.s=sigW(w);
  li.className="linha "+w.estado;
  li.style.setProperty("--cor",cor);
  let bolas="";
  for(let k=1;k<=w.etapas;k++){
    let cls="bola";
    if(k<=w.feitas) cls+=" feita";
    else if(k===w.feitas+1&&(w.estado==="rodando"||w.estado==="despachado")) cls+=" ativa";
    bolas+=`<div class="${cls}" style="--cor:${cor}"></div>`;
  }
  li.innerHTML=`
        <div class="braco"><div class="chip" style="--cor:${cor}"></div>
          <div><b>${w.braco}</b><small>${w.worker}${w.nota? " · "+w.nota:""}</small></div></div>
        <div class="pista">${bolas}</div>
        <div class="placar"><b>${w.feitas}/${w.etapas}</b>
          <div class="estado ${w.estado}">${ROTULO_ESTADO[w.estado]||w.estado}</div></div>`;
  return li;
}
async function tick(){
  try{
    const r=await fetch("state.json?ts="+Date.now());
    const d=await r.json();
    const ws=d.workers||[];
    const done=ws.filter(w=>w.estado==="entregue").length;
    document.getElementById("missao").textContent=d.missao||"";
    document.getElementById("meta").textContent=
      `${done}/${ws.length} entregues · atualizado ${d.gerado}`;
    const sig=JSON.stringify(ws.map(sigW));
    if(sig===lastSig) return;
    lastSig=sig;
    const g=document.getElementById("grid");
    const y=scrollY,x=scrollX,h=g.offsetHeight;
    if(h) g.style.minHeight=h+"px";
    const byId={};
    [...g.children].forEach(el=>{byId[el.dataset.w]=el});
    const next=[];
    for(const w of ws){
      const velho=byId[w.worker];
      next.push(velho&&velho.dataset.s===sigW(w)?velho:pintar(w));
    }
    next.forEach((el,i)=>{if(g.children[i]!==el) g.insertBefore(el,g.children[i]||null)});
    while(g.children.length>next.length) g.removeChild(g.lastChild);
    if(scrollY!==y||scrollX!==x) scrollTo(x,y);
    requestAnimationFrame(()=>{g.style.minHeight=""});
  }catch(e){ /* run ainda subindo */ }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
